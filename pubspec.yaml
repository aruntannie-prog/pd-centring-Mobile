name: pd_centring
description: PD Centring - Shuttering Rental Management
version: 3.1.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.3.3
  provider: ^6.1.5+1
  gsheets: ^0.5.0
  flutter_dotenv: ^6.0.0
  googleapis: ^11.4.0
  googleapis_auth: ^1.6.0
  image_picker: ^1.1.2
  file_picker: ^8.3.0
  image_cropper: ^11.0.0
  google_mlkit_face_detection: ^0.13.1
  image: ^4.8.0
  cached_network_image: ^3.4.0
  url_launcher: ^6.3.1
  flutter_image_compress: ^2.1.0
  cross_file: ^0.3.3+8
  js: ^0.7.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.1.2
  firebase_storage: ^12.4.10

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
    - .env
